name: Instagram story quiz

on:
  schedule:
    # GitHub cron runs in UTC. Two slots per story cover summer and winter time;
    # the script only acts once the configured Berlin hour has been reached and
    # the step has not been done today (see question_hour / reveal_hour in config.json).
    - cron: "0 7 * * *"    # question, 09:00 Berlin in summer
    - cron: "0 8 * * *"    # question, 09:00 Berlin in winter
    - cron: "0 19 * * *"   # reveal, 21:00 Berlin in summer
    - cron: "0 20 * * *"   # reveal, 21:00 Berlin in winter
    - cron: "0 3 * * 1"    # weekly token refresh
    - cron: "0 4 1 * *"    # monthly location import for new posts
  workflow_dispatch:
    inputs:
      job:
        description: Which step to run
        type: choice
        options: [question, reveal, refresh, locations]
        default: question

permissions:
  contents: write

concurrency:
  group: story-quiz
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs
      # Pause switch: Settings -> Secrets and variables -> Actions -> Variables.
      # QUIZ_PAUSED=true stops new questions; QUIZ_PAUSED_UNTIL=2026-09-14 pauses
      # through that date. A manual "Run workflow" always ignores the pause.
      QUIZ_PAUSED: ${{ vars.QUIZ_PAUSED }}
      QUIZ_PAUSED_UNTIL: ${{ vars.QUIZ_PAUSED_UNTIL }}
      QUIZ_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # branch tip at run start, not the commit pinned when the run was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide which step to run
        id: which
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*)          job="${{ inputs.job }}" ;;
            *"0 7 * * *"|*"0 8 * * *")    job=question ;;
            *"0 19 * * *"|*"0 20 * * *")  job=reveal ;;
            *"0 3 * * 1")                 job=refresh ;;
            *"0 4 1 * *")                 job=locations ;;
            *)                            echo "unknown trigger"; exit 1 ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          git config user.name "story-quiz-bot"
          git config user.email "story-quiz-bot@users.noreply.github.com"

      - name: Load access token
        # Uses the token the refresh job stored encrypted in state/token.enc.
        # Falls back to the IG_ACCESS_TOKEN secret, and switches back to the
        # secret automatically when you paste a new token into it.
        env:
          SECRET_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          token="$SECRET_TOKEN"
          fingerprint=$(printf '%s' "$SECRET_TOKEN" | sha256sum | cut -c1-16)
          if [ -n "$TOKEN_KEY" ] && [ -f state/token.enc ] && [ "$(cat state/token.src 2>/dev/null)" = "$fingerprint" ]; then
            token=$(openssl enc -d -aes-256-cbc -pbkdf2 -k "$TOKEN_KEY" -in state/token.enc)
            echo "Using the stored refreshed token"
          else
            echo "Using the IG_ACCESS_TOKEN secret"
          fi
          echo "::add-mask::$token"
          echo "IG_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SECRET_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Import location tags for new posts
        if: steps.which.outputs.job == 'locations'
        run: |
          python import_locations.py
          git add locations.json
          git commit -m "Import location tags" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Render image and update state
        if: steps.which.outputs.job == 'question' || steps.which.outputs.job == 'reveal'
        run: python story_quiz.py make ${{ steps.which.outputs.job }}

      - name: Push image so Instagram can fetch it
        if: steps.which.outputs.job == 'question' || steps.which.outputs.job == 'reveal'
        run: |
          git add docs state
          git commit -m "Prepare ${{ steps.which.outputs.job }} $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Publish story
        if: steps.which.outputs.job == 'question' || steps.which.outputs.job == 'reveal'
        run: python story_quiz.py publish ${{ steps.which.outputs.job }}

      - name: Save publish state
        if: steps.which.outputs.job == 'question' || steps.which.outputs.job == 'reveal'
        run: |
          git add state
          git commit -m "Published ${{ steps.which.outputs.job }} $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Refresh access token
        if: steps.which.outputs.job == 'refresh'
        id: refresh
        run: python story_quiz.py refresh

      - name: Store refreshed token, encrypted, in the repository
        if: steps.which.outputs.job == 'refresh'
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          NEW_TOKEN: ${{ steps.refresh.outputs.token }}
        run: |
          if [ -z "$TOKEN_KEY" ]; then
            echo "::error::TOKEN_KEY secret is not set, the refreshed token could not be saved. Paste a fresh token into IG_ACCESS_TOKEN before it expires, or set TOKEN_KEY (see README)."
            exit 1
          fi
          mkdir -p state
          printf '%s' "$NEW_TOKEN" | openssl enc -aes-256-cbc -pbkdf2 -k "$TOKEN_KEY" -out state/token.enc
          printf '%s' "$SECRET_FINGERPRINT" > state/token.src
          git add state/token.enc state/token.src
          git commit -m "Refresh access token" || echo "nothing to commit"
          git pull --rebase
          git push
